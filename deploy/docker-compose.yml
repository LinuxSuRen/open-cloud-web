services:
  ocw:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: opencloudlab/ocw:latest
    container_name: ocw
    ports:
      - "8080:8080"
    volumes:
      # sqlite + tofu workspaces + plugin-cache 持久化
      - ./data:/app/data
      # 可选：覆盖内置 tofu 模板（按 provider 子目录）
      - ./tofu-templates:/app/templates:ro
    environment:
      OCW_LISTEN_ADDR: ":8080"
      OCW_DATA_DIR: "/app/data"
      OCW_DB_PATH: "/app/data/ocw.db"
      OCW_JWT_SECRET: "change-me-to-a-long-random-string"
      OCW_ADMIN_BOOTSTRAP_TOKEN: "change-me-admin-bootstrap-token"
      # 飞书 OAuth（可选）
      OCW_FEISHU_CLIENT_ID: ""
      OCW_FEISHU_CLIENT_SECRET: ""
      OCW_FEISHU_REDIRECT_URL: "http://localhost:8080/api/v1/auth/feishu/callback"
      # 云凭据（按需填写）
      OCW_ALICLOUD_ACCESS_KEY: ""   # 阿里云 AccessKey
      OCW_ALICLOUD_SECRET_KEY: ""
      OCW_VOLCENGINE_ACCESS_KEY: "" # 火山引擎 AccessKey
      OCW_VOLCENGINE_SECRET_KEY: ""
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
